abstract: Dataset contains electroencephalographic recordings on 21 subjects doing a visual P300 experiment on PC and VR.
  The visual P300 is an event-related potential elicited by a visual stimulation, peaking 240–600 ms after stimulus onset.
  The experiment compares P300-based BCI on PC vs VR headset (passive HMD with smartphone) concerning physiological, subjective
  and performance aspects. EEG recorded with 16 electrodes. Experiment conducted at GIPSA-lab in 2018.
